[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biscit"
version = "0.3.0.dev0+heterozygosity"
description = "HMM-based imputation of offspring genotypes from offspring allelic depths and parental PL arrays (A. thaliana RIL crosses)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "h5py>=3.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
biscit = "biscit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
